<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f7fb">
<title>页面不存在 · 404</title>
<style>
    :root {
        --bg: #f5f7fb;
        --text: #111827;
        --muted: #6b7280;
        --border: rgba(17, 24, 39, .08);
        --panel: rgba(255, 255, 255, .78);
        --brand: #4f46e5;
        --brand-2: #0ea5e9;
        --brand-3: #8b5cf6;
        --shadow: 0 24px 80px rgba(17, 24, 39, .08);
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #0b1020;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --border: rgba(255, 255, 255, .08);
            --panel: rgba(17, 24, 39, .62);
            --shadow: 0 24px 80px rgba(0, 0, 0, .45);
        }
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: clamp(20px, 5vw, 48px);
        overflow-x: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
    }

    /* 背景光晕 + 网格，纯 CSS，不加载任何外部资源 */
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
            radial-gradient(60% 50% at 12% 8%, rgba(79, 70, 229, .16), transparent 70%),
            radial-gradient(50% 45% at 88% 18%, rgba(14, 165, 233, .14), transparent 70%),
            radial-gradient(50% 50% at 50% 108%, rgba(139, 92, 246, .12), transparent 72%);
    }

    body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        opacity: .28;
        background-image:
            linear-gradient(rgba(17, 24, 39, .06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(17, 24, 39, .06) 1px, transparent 1px);
        background-size: 56px 56px;
        -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 78%);
        mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 78%);
    }

    @media (prefers-color-scheme: dark) {
        body::after {
            background-image:
                linear-gradient(rgba(255, 255, 255, .05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, .05) 1px, transparent 1px);
        }
    }

    .panel {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 720px;
        padding: clamp(32px, 6vw, 64px) clamp(22px, 5vw, 56px);
        text-align: center;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: clamp(20px, 4vw, 28px);
        box-shadow: var(--shadow);
        -webkit-backdrop-filter: blur(16px) saturate(140%);
        backdrop-filter: blur(16px) saturate(140%);
        animation: rise .6s cubic-bezier(.22, .8, .3, 1) both;
    }

    @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 clamp(18px, 3vw, 26px);
        padding: 7px 14px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(79, 70, 229, .08);
        color: var(--brand);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: .12em;
        text-transform: uppercase;
    }

    .eyebrow::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 0 4px rgba(79, 70, 229, .14);
    }

    .code {
        margin: 0;
        font-size: clamp(76px, 17vw, 148px);
        font-weight: 800;
        line-height: .88;
        letter-spacing: -.045em;
        background: linear-gradient(118deg, var(--brand) 8%, var(--brand-2) 58%, var(--brand-3) 96%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .title {
        margin: clamp(16px, 3vw, 24px) 0 0;
        font-size: clamp(21px, 3.4vw, 28px);
        font-weight: 700;
        letter-spacing: -.01em;
    }

    .desc {
        margin: 14px auto 0;
        max-width: 46ch;
        color: var(--muted);
        font-size: clamp(14px, 2.2vw, 15px);
        line-height: 1.85;
    }

    .req {
        margin: 18px auto 0;
        max-width: 100%;
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.7;
        word-break: break-all;
    }

    .req code {
        display: inline-block;
        max-width: 100%;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: rgba(17, 24, 39, .04);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        color: var(--text);
    }

    @media (prefers-color-scheme: dark) {
        .req code { background: rgba(255, 255, 255, .05); }
    }

    .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: clamp(26px, 4vw, 36px);
    }

    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 26px;
        border-radius: 12px;
        border: 1px solid transparent;
        font-size: 14.5px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: background-color .18s ease, border-color .18s ease, color .18s ease, box-shadow .18s ease;
    }

    .btn:focus-visible {
        outline: 2px solid var(--brand-2);
        outline-offset: 3px;
    }

    .btn-primary {
        color: #fff;
        background: linear-gradient(120deg, var(--brand), var(--brand-2));
        box-shadow: 0 10px 26px rgba(79, 70, 229, .26);
    }

    .btn-primary:hover {
        background: linear-gradient(120deg, #4338ca, #0284c7);
        box-shadow: 0 12px 30px rgba(79, 70, 229, .34);
    }

    .btn-ghost {
        color: var(--text);
        background: transparent;
        border-color: var(--border);
    }

    .btn-ghost:hover {
        background: rgba(17, 24, 39, .05);
        border-color: rgba(17, 24, 39, .18);
    }

    @media (prefers-color-scheme: dark) {
        .btn-ghost:hover {
            background: rgba(255, 255, 255, .06);
            border-color: rgba(255, 255, 255, .2);
        }
    }

    .back {
        margin: clamp(22px, 4vw, 30px) 0 0;
        color: var(--muted);
        font-size: 12.5px;
    }

    .back button {
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
    }

    .back button:hover { color: var(--text); }

    @media (max-width: 480px) {
        .actions { flex-direction: column; }
        .btn { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
        .panel { animation: none; }
        * { transition: none !important; }
    }
</style>
</head>
<body>
    <main class="panel">
        <p class="eyebrow">Error 404</p>
        <p class="code" aria-hidden="true">404</p>
        <h1 class="title">页面走丢了</h1>
        <p class="desc">你访问的地址不存在、已被移除，或者链接输错了。检查一下网址，或从下面重新出发。</p>
        <p class="req">请求地址：<code id="req-path">—</code></p>

        <div class="actions">
            <a class="btn btn-primary" href="/">返回首页</a>
            <a class="btn btn-ghost" href="/goods_list">浏览商品</a>
        </div>

        <p class="back"><button type="button" id="go-back">返回上一页</button></p>
    </main>

    <script>
        (function () {
            var pathEl = document.getElementById('req-path');
            if (pathEl) {
                pathEl.textContent = location.pathname + location.search;
            }

            var backEl = document.getElementById('go-back');
            if (backEl) {
                backEl.addEventListener('click', function () {
                    if (window.history.length > 1) {
                        window.history.back();
                    } else {
                        window.location.href = '/';
                    }
                });
            }
        })();
    </script>
</body>
</html>
