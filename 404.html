<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f3efe6">
<title>页面不存在 · 404</title>
<style>
    :root {
        --paper: #f3efe6;
        --ink: #141414;
        --muted: #625d53;
        --orange: #ff4d1f;
        --line: rgba(20, 20, 20, .16);
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
    }

    .poster {
        display: grid;
        grid-template-columns: minmax(0, 1fr) clamp(120px, 26vw, 360px);
        min-height: 100vh;
        min-height: 100dvh;
    }

    .main {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 32px;
        min-width: 0;
        padding: clamp(24px, 4.5vw, 64px);
    }

    .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: .22em;
        text-transform: uppercase;
    }

    .top .mark::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 10px;
        vertical-align: 1px;
        background: var(--orange);
    }

    .hero {
        margin: auto 0;
        padding: clamp(10px, 2vh, 28px) 0;
    }

    .code {
        margin: 0 0 0 -.055em;
        font-size: clamp(96px, 18vw, 240px);
        font-weight: 900;
        line-height: .8;
        letter-spacing: -.07em;
        text-shadow:
            clamp(5px, .9vw, 13px) clamp(5px, .9vw, 13px) 0 var(--orange);
    }

    h1 {
        margin: clamp(14px, 2.4vw, 24px) 0 0;
        font-size: clamp(34px, 5.2vw, 64px);
        font-weight: 900;
        line-height: .98;
        letter-spacing: -.035em;
    }

    .desc {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: clamp(14px, 1.6vw, 15.5px);
        line-height: 1.9;
    }

    .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px 26px;
        margin-top: clamp(22px, 3.2vw, 32px);
    }

    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 50px;
        padding: 0 30px;
        border: 2px solid var(--ink);
        border-radius: 0;
        background: var(--orange);
        color: var(--ink);
        font-size: 15px;
        font-weight: 800;
        letter-spacing: .02em;
        text-decoration: none;
        transition: background-color .16s ease, color .16s ease;
    }

    .btn:hover {
        background: var(--ink);
        color: var(--paper);
    }

    .link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 4px 0;
        border-bottom: 2px solid var(--ink);
        color: var(--ink);
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        transition: color .16s ease, border-color .16s ease;
    }

    .link:hover {
        color: var(--orange);
        border-color: var(--orange);
    }

    .btn:focus-visible,
    .link:focus-visible,
    .back:focus-visible {
        outline: 3px solid var(--orange);
        outline-offset: 3px;
    }

    .bottom {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 20px;
        padding-top: 15px;
        border-top: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 10.5px;
        line-height: 1.7;
        color: var(--muted);
    }

    .path {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-width: 0;
        margin: 0;
    }

    .path span {
        flex: none;
        letter-spacing: .18em;
    }

    .path code {
        display: inline-block;
        max-width: min(52vw, 560px);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--ink);
        font-family: inherit;
        font-size: 10.5px;
    }

    .back {
        flex: none;
        color: var(--muted);
        text-decoration: none;
        letter-spacing: .06em;
        transition: color .16s ease;
    }

    .back:hover { color: var(--ink); }

    /* 右侧色块 */
    .side {
        position: relative;
        overflow: hidden;
        background: var(--orange);
    }

    .side .vertical {
        position: absolute;
        left: clamp(16px, 2vw, 28px);
        bottom: clamp(24px, 4vw, 44px);
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: .32em;
        text-transform: uppercase;
        color: var(--ink);
    }

    .side .shape {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(64%, 260px);
        aspect-ratio: 1;
        border: 2px solid var(--ink);
        border-radius: 50%;
        transform: translate(-50%, -50%);
    }

    .side .shape::before {
        content: "";
        position: absolute;
        left: 50%;
        top: -10%;
        width: 2px;
        height: 120%;
        background: var(--ink);
        transform: translateX(-50%);
    }

    .side .shape::after {
        content: "";
        position: absolute;
        left: -10%;
        top: 50%;
        width: 120%;
        height: 2px;
        background: var(--ink);
        transform: translateY(-50%);
    }

    @media (max-width: 760px) {
        .poster {
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: clamp(72px, 16vw, 104px) minmax(0, 1fr);
        }

        .side {
            grid-row: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(20px, 5vw, 32px);
        }

        .side .vertical {
            position: static;
            writing-mode: horizontal-tb;
            transform: none;
            letter-spacing: .24em;
            font-size: 10px;
        }

        .side .shape {
            position: relative;
            left: auto;
            top: auto;
            width: clamp(40px, 10vw, 56px);
            transform: none;
        }

        .main {
            gap: 28px;
            padding: clamp(22px, 5vw, 36px);
        }

        .bottom {
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

        .path { width: 100%; }
        .path code { max-width: 100%; }
    }

    @media (max-width: 420px) {
        .actions { align-items: stretch; flex-direction: column; }
        .btn { width: 100%; }
        .link { align-self: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
    }
</style>
</head>
<body>
    <div class="poster">
        <section class="main">
            <header class="top">
                <span class="mark">Error / 404</span>
                <span>Not Found</span>
            </header>

            <div class="hero">
                <p class="code" aria-hidden="true">404</p>
                <h1>此路不通。</h1>
                <p class="desc">这个地址背后没有页面。也许链接已经失效，或者它从未存在过。</p>

                <div class="actions">
                    <a class="btn" href="/">回到首页</a>
                    <a class="link" href="/goods_list">浏览商品<span aria-hidden="true">↗</span></a>
                </div>
            </div>

            <footer class="bottom">
                <p class="path">
                    <span>URL</span>
                    <code id="req-path">—</code>
                </p>
                <a class="back" id="go-back" href="/">返回上一页</a>
            </footer>
        </section>

        <aside class="side" aria-hidden="true">
            <span class="vertical">Page Not Found — 404 — Lost Route</span>
            <span class="shape"></span>
        </aside>
    </div>

    <script>
        (function () {
            var pathEl = document.getElementById('req-path');
            if (pathEl) {
                pathEl.textContent = location.pathname + location.search;
            }

            var backEl = document.getElementById('go-back');
            if (backEl) {
                backEl.addEventListener('click', function (e) {
                    if (window.history.length > 1) {
                        e.preventDefault();
                        window.history.back();
                    }
                });
            }
        })();
    </script>
</body>
</html>
